name: Feature request
description: An idea, or something you wish UniverseView could do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the situation, such as the kind of project (history, fiction, a tabletop campaign) and what is hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. A rough sketch or an example note is welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now
      description: Any workaround, or other tools that handle this well.
